version: '3.8'
services:
  openperf1:
    user: "${UID}:${GID}"  # 添加这一行关键配置
    image: openperf:latest
    build: $T1_HOME
    container_name: openperf1
    network_mode: host
    tty: true               # 对应 -t 参数
    stdin_open: true        # 对应 -i 参数
    volumes:
      # 挂载目录
      - "${T1_HOME}:/home/openperf"
    environment:
      - T1_HOME=/home/openperf
      - AM_HOME=/home/openperf/nexus-am
      - GEM5=/home/openperf/GEM5
      - OPENPERF_HOME=/home/openperf/openperf
      - NEMU_HOME=/home/openperf/NEMU
      - SCRIPT_HOME=/home/openperf/script
      - LINUX_GNU_TOOLCHAIN=1
      - GCBV_REF_SO=/home/openperf/riscv64-nemu-interpreter-c1469286ca32-so
